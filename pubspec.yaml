name: gerenciador_tarefas
description: Gerenciador de tarefas com Firebase Auth, Realtime Database e SharedPreferences.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  firebase_database: ^13.0.1
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
